name: Unity Tests

on:
  push:
  pull_request:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup test project
        run: bash .github/scripts/setup_test_project.sh "$GITHUB_WORKSPACE/TestProject"

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: unity-library-2022.3.22f1-${{ hashFiles('.github/scripts/setup_test_project.sh') }}

      # Personal ライセンスは UNITY_LICENSE(.ulf の中身)+ UNITY_EMAIL + UNITY_PASSWORD が必要
      # https://game.ci/docs/github/activation
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject
          unityVersion: 2022.3.22f1
          testMode: editmode
          customParameters: -assemblyNames NDMFDeform.Tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts
          if-no-files-found: ignore
