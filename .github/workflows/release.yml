# タグ push (v*) でパッケージ zip を作り GitHub Release に添付する。
# zip はパッケージ内容がルートに来る VPM 形式(リポジトリルート = パッケージルート)。
# 0.9.x(移行リリース)は Deform フォークを同梱し、1.0.0 以降はフォーク削除後の内容になる。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Deform はサブモジュール(0.x の移行リリースでは zip に同梱する)。
      # 取得しないと空の Deform/ が入り、旧システムがコンパイルエラーになる
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify tag matches package.json version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      # zip を作る前に .meta 欠落・JSON 破損を弾く(Unity 不要・数秒)。
      # Unity テストはタグの元コミットのブランチ実行で通っている前提。
      - name: Validate package (JSON + .meta consistency)
        run: python3 .github/scripts/validate_package.py

      - name: Build package zip
        run: |
          NAME=$(jq -r .name package.json)
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="$NAME-$VERSION.zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r "/tmp/$ZIP" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "TestProject/*" \
            -x "*.zip" \
            -x "*/.git" \
            -x "*/.git/*" \
            -x "*/.github/*"
          mv "/tmp/$ZIP" "$ZIP"
          unzip -l "$ZIP" | head -20

      # 従来どおり unitypackage でも導入できるようにする
      # (Packages/ 配下へ展開される形式。Unity なしで .meta の GUID から生成)
      - name: Build unitypackage
        run: |
          UNITYPACKAGE="NDMFDeform_v${{ steps.version.outputs.version }}.unitypackage"
          echo "UNITYPACKAGE=$UNITYPACKAGE" >> "$GITHUB_ENV"
          python3 .github/scripts/build_unitypackage.py . "$UNITYPACKAGE"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.UNITYPACKAGE }}
            package.json
          generate_release_notes: true

      # VPM リスティング(c-colloid/vpm)は cron でも収集するが反映が数時間遅れる
      # ことがあるため、リリース確定時に repository_dispatch で即時再生成を促す。
      # 通知は付随処理であり、失敗してもリリース自体は成功のまま(cron が予備で拾う)。
      # アセットのアップロードを終える Create release の後段に置くことで、
      # リスティングが読みに来た時点で zip と package.json が揃っていることを保証する。
      # トークンは vpm の Contents 書き込みのみに絞った fine-grained PAT。
      - name: Notify the VPM listing repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VPM_DISPATCH_TOKEN }}
          LISTING_REPO: c-colloid/vpm
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::VPM_DISPATCH_TOKEN is not set; the listing will pick this release up on its next scheduled run."
            exit 0
          fi
          gh api "repos/${LISTING_REPO}/dispatches" \
            -f "event_type=package-released" \
            -f "client_payload[repo]=${SOURCE_REPO}" \
            -f "client_payload[version]=${SOURCE_VERSION}"
