name: Validate

on:
  # タグ push は同一 SHA のブランチ実行と重複するため走らせない
  # (リリース時の検証は release.yml 内で行う)
  push:
    tags-ignore: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package (JSON + .meta consistency)
        run: python3 .github/scripts/validate_package.py
